apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  namespace: bcos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: bcos
spec:
  selector:
    app: chroma
  ports:
    - port: 8000
      targetPort: 8000
