apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bcos-ingress
  namespace: bcos
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - bcos.example.com
      secretName: bcos-tls
  rules:
    - host: bcos.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
