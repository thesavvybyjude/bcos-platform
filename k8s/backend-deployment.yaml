apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: bcos
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/your-org/bcos-platform/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bcos-db
                  key: DATABASE_URL
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: KNOWLEDGE_BASE_PATH
              value: "/app/data/business_context"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: bcos
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
