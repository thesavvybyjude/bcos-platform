# ═══════════════════════════════════════════════════════════
# BCOS Platform — Docker Compose
# ═══════════════════════════════════════════════════════════
# Services: PostgreSQL, Redis, Neo4j, Backend (FastAPI)
# Chroma runs embedded in the backend process (no separate container)
# ═══════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: bcos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bcos
      POSTGRES_PASSWORD: bcos_secret
      POSTGRES_DB: bcos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: bcos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j ──
  neo4j:
    image: neo4j:5-community
    container_name: bcos-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/bcos_neo4j_secret
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p bcos_neo4j_secret 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── Backend (FastAPI) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bcos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bcos:bcos_secret@postgres:5432/bcos
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: bcos_neo4j_secret
      SECRET_KEY: ${SECRET_KEY:-change_me_docker_dev_key_at_least_32_chars_long_here}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-DockerDev2026!Strong}
      KNOWLEDGE_BASE_PATH: /app/data/business_context
      CHROMA_PERSIST_DIR: /app/data/chroma
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:8000"]'
      DEBUG: "true"
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
